# One-off, read-only inspection of leftover row versions of list_draft (sizes only, no content).
name: Check backups
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        env:
          TOKEN: ${{ secrets.SUPABASE_DB_TOKEN }}
        run: |
          run() { jq -n --arg q "$1" '{query:$q}' > b.json; curl -sS -X POST "https://api.supabase.com/v1/projects/znszotxuhkxgbszhyqcp/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data @b.json; echo; }
          run "create extension if not exists pageinspect with schema extensions"
          run "select lp, lp_flags, lp_len, t_xmin, t_xmax, t_ctid, substring(encode(t_data,'hex') from 1 for 60) as head from extensions.heap_page_items(extensions.get_raw_page('public.list_draft'::text,0)) order by lp"
          run "select c.reltoastrelid::regclass::text as toast, pg_relation_size(c.reltoastrelid) as toast_bytes, (select n_dead_tup from pg_stat_all_tables where relid=c.reltoastrelid) as toast_dead, (select n_live_tup from pg_stat_all_tables where relid=c.reltoastrelid) as toast_live, (select last_autovacuum from pg_stat_all_tables where relid=c.reltoastrelid) as toast_av from pg_class c where c.oid='public.list_draft'::regclass"
