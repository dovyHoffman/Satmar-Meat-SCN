# Deploys the Scanovator sync function to Supabase every time its code changes here.
# One-time setup: add the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
name: Deploy scanovator-sync
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy scanovator-sync --project-ref znszotxuhkxgbszhyqcp --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
