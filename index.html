function bsPlan(names,weeks,today){
 // names in workbook order; a company tab belongs to the ORDERS_m_d tab above it when the date in its name is within 3 days of it

 const near=(digits,a)=>{const ts=a.t;for(const k of [1,2]){if(digits.length<=k)continue;const m=+digits.slice(0,k),d=+digits.slice(k);if(m<1||m>12||d<1||d>31)continue;const t=new Date(a.y,m-1,d).getTime();if(t<=ts+864e5&&t>=ts-3*864e5)return true}return false};
 for(const n of names){
  const o=String(n).match(/^orders[_ ](\d{1,2})_(\d{1,2})$/i);
  if(o){let y=now.getFullYear();if(new Date(y,+o[1]-1,+o[2])>new Date(now.getTime()+10*864e5))y--;anc={m:+o[1],d:+o[2],y:y,t:new Date(y,+o[1]-1,+o[2]).getTime(),tabs:[]};seen.push(anc);continue}

  const iso=a.y+"-"+String(a.m).padStart(2,"0")+"-"+String(a.d).padStart(2,"0");

  {const t0=weekStart(),n=cust.filter(c=>(c.pods||[]).some(p=>p.ts&&p.ts>=t0)).length;S.msg+=" Customers with a delivery this week: "+n+". Example IDs in your list: "+cust.slice(0,3).map(c=>c.ref).join(", ")+".";S.msg+=" Orders in the last 28 days: with a customer code "+wc+", with an online order id "+wo+", delivered "+dn+(cex.length?". Examples of codes found on orders: "+cex.join(", "):"")+(dsm.length?". Fields on a delivered order: "+dsm.join("; "):"")+".";S.msg+=(ck.length?" Box letters read from: "+ck.join(", ")+".":" No \"case description\" field was found on the orders.");S.msg+=(Object.keys(idp).length?" Your IDs were found in these order fields: "+Object.entries(idp).map(([k,v])=>k+" ("+v+")").join(", ")+".":"")+(nom&&sp.length?" Fields on an order: "+sp.join("; ")+".":"");if(DG.delivered_skipped!=null){S.msg+=" Not matched, delivered in the last 6 days: "+DG.delivered_skipped+" (no customer ID on the order: "+(DG.no_code||0)+"; name matches exactly one customer: "+(DG.name_unique||0)+"; name matches several: "+(DG.name_several||0)+"; only the phone is in your list: "+(DG.phone_only||0)+"; nothing matches: "+(DG.nothing||0)+")."}S.syncRes=S.msg}

/* ---- automatic delivery sync: Mon-Fri 10:00-21:00 New York, every 15 minutes, owner signed in, last 3 days only ---- */
function autoOn(){try{return localStorage.getItem("sm_autosync")!=="0"}catch(e){return true}}
function autoSet(v){try{localStorage.setItem("sm_autosync",v?"1":"0")}catch(e){}render()}
function nyNow(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",hour12:false}).formatToParts(new Date()),g=t=>(p.find(x=>x.type==t)||{}).value;return {d:g("weekday"),h:Number(g("hour"))%24}}
function autoDays(){const m={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6}[nyNow().d]||0;return m+4}   // back to Monday of this week, plus 3 days because an order is created before it is delivered
function autoWin(){const n=nyNow();return ["Mon","Tue","Wed","Thu","Fri"].includes(n.d)&&n.h>=10&&n.h<21}
setInterval(()=>{try{if(!S.user||S.user.role!="owner"||S.syncing||!autoOn()||!autoWin())return;if(S.autoAt&&Date.now()-S.autoAt<15*60e3)return;S.autoAt=Date.now();syncNow(true)}catch(e){}},60e3);


/* ---- deliveries shown from the database ---- */
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return d.getTime()}   // last Saturday 00:00
function dlv(c){
 const w=weekDel(c),ps=w.ps.slice().sort((a,b)=>a.ts-b.ts);
 if(!ps.length)return `<div class="dlvrow"><div class="dlvh"><b>Delivery this week</b><span class="ctag t-no">${c.active===false?"Not active · not on this week's list":"Not yet"}</span></div></div>`;
 const head=w.state=="part"?`<span class="ctag t-part">${w.got} of ${w.need} boxes delivered</span>`:`<span class="ctag t-ok">${w.need>1?"All "+w.need+" boxes delivered":"Delivered"}</span>`;
 return `<div class="dlvrow ${w.state=="part"?"part":""}"><div class="dlvh"><b>Delivery this week${ps.length>1?" ("+ps.length+")":""}</b>${head}</div>`+ps.map(p=>{const has=p.links.length||(p.paths||[]).some(x=>x&&x!="-");
  return `<div class="dlv1">${letterChip(c,p)||'<span class="ctag t-ok">Delivered</span>'}<span class="dwho">${esc([p.drv,shortAt(p.at)].filter(Boolean).join(" · "))}</span>${has?`<button onclick="showPodO(${c.id},'${esc(p.oid)}')">View photo${p.links.length>1?"s ("+p.links.length+")":""}</button>`:'<span class="note">no photo yet</span>'}${/^https?:\/\//i.test(p.rec)?`<a href="${esc(p.rec)}" target="_blank" rel="noopener noreferrer">Receipt</a>`:""}</div>`}).join("")+`</div>`}
function podRec(c,w){const p=w._p||podFor(c,w.w);if(!p)return "";const r=p.rec;return (/^https?:\/\//i.test(r)?`<a href="${esc(r)}" onclick="return linkPop(this.href,'Receipt')">Receipt</a> `:"")+`<span class="note">${esc([p.drv,p.at||p.k].filter(Boolean).join(" · "))}</span>`}
function podPics(c,w){const p=w._p||podFor(c,w.w);if(!p)return "";return (p.links.length||(p.paths||[]).some(x=>x&&x!="-"))?`<button onclick="showPodO(${c.id},'${esc(p.oid)}')">View photo${p.links.length>1?"s ("+p.links.length+")":""}</button>`:'<span class="note">no photo yet</span>'}
function showPodO(id,oid){const c=cust.find(x=>x.id==id),p=(c.pods||[]).find(x=>x.oid==oid);if(p)showPodP(c,p)}

render();
boot();
