 ${(H.rows||[]).map(r=>{const who=r.table_name=="customers"?byU[r.row_id]:r.table_name=="change_requests"?byU[(r.new||r.old||{}).customer_id]:"";const d=hDiff(r);
 return `<tr><td style="white-space:nowrap">${esc(fdate(r.at))}</td><td>${esc(r.user_name||"system")}</td><td>${esc((T[r.table_name]||r.table_name)+" · "+r.action.toLowerCase())}</td><td>${esc(who||"")}</td><td style="white-space:normal">${esc(d).replace(/&lt;br&gt;/g,"<br>")}</td></tr>`}).join("")||"<tr><td colspan=5 class='no'>No changes recorded yet.</td></tr>"}</table></div></div>`}
async function saveNextWeek(){
 const v=(document.getElementById("nw_in").value||"").trim();if(!/^\d{1,2}\/\d{1,2}$/.test(v)){S.err="Write the date like 11/9.";S.msg="";render();return}
 const {error}=await sb.from("app_settings").upsert({key:"next_week",value:v,updated_at:new Date().toISOString()});
 if(error){S.err="Not saved: "+dberr(error);S.msg=""}else{S.nextWk=v;S.msg="Saved.";S.err=""}render()}


async function syncNow(){
 if(S.syncing)return;S.syncing=true;S.msg="";S.err="";S.syncMsg="Starting…";render();
 const call=async body=>{const {data:ss}=await sb.auth.getSession(),tok=ss&&ss.session&&ss.session.access_token;
  const r=await fetch(SB_URL+"/functions/v1/scanovator-sync",{method:"POST",headers:{Authorization:"Bearer "+tok,apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status==546)throw new Error("Supabase stopped the function (too heavy). Press the button again.");
  if(r.status==404)throw new Error("the function is not deployed yet");
  if(!r.ok||!j.ok)throw new Error(j.error||("error "+r.status));return j};
 let saved=0,copied=0,vid=0,vph=0,vnm=0,nom=0,codes=[],idp={},sp=[],wc=0,wo=0,dn=0,cex=[],dsm=[],ck=[];
 try{
  let off=0,total=0;
  while(off!==null){S.syncMsg="Reading deliveries… "+Math.min(off,total||off)+(total?" / "+total:"")+" customers";render();
   let j;for(let t=0;;t++){try{j=await call({mode:"orders",offset:off,loose:!!S.loose});break}catch(e){if(t>=2)throw e;await new Promise(r=>setTimeout(r,2000))}}
   saved+=j.deliveries_saved;vid+=j.via_id||0;vnm+=j.via_name||0;wc+=j.with_code||0;wo+=j.with_online||0;dn+=j.delivered_n||0;cex=cex.concat(j.code_examples||[]).slice(0,6);if(!dsm.length)dsm=j.delivered_sample||[];ck=ck.concat(j.case_keys||[]).slice(0,3);vph+=j.via_phone||0;nom+=j.no_match||0;if(codes.length<3)codes=codes.concat(j.phone_match_codes||[]).slice(0,3);Object.entries(j.id_paths||{}).forEach(([k,v])=>{idp[k]=(idp[k]||0)+v});if(!sp.length)sp=(j.sample_paths||[]).slice(0,60);total=j.total;off=j.next}
  S.msg="Deliveries saved: "+saved+" (matched by customer ID: "+vid+(S.loose?"; matched by name + phone: "+vnm:"")+"; orders skipped because the ID did not match: "+nom+"). Pictures are loaded when you open them."+(nom&&codes.length?" Examples of codes that did not match: "+codes.join(", ")+".":"");BILL.real=false;await loadDB();
  {const t0=weekStart(),n=cust.filter(c=>(c.pods||[]).some(p=>p.ts&&p.ts>=t0)).length;S.msg+=" Customers with a delivery this week: "+n+". Example IDs in your list: "+cust.slice(0,3).map(c=>c.ref).join(", ")+".";S.msg+=" Orders in the last 28 days: with a customer code "+wc+", with an online order id "+wo+", delivered "+dn+(cex.length?". Examples of codes found on orders: "+cex.join(", "):"")+(dsm.length?". Fields on a delivered order: "+dsm.join("; "):"")+".";S.msg+=(ck.length?" Box letters read from: "+ck.join(", ")+".":" No \"case description\" field was found on the orders.");S.msg+=(Object.keys(idp).length?" Your IDs were found in these order fields: "+Object.entries(idp).map(([k,v])=>k+" ("+v+")").join(", ")+".":"")+(nom&&sp.length?" Fields on an order: "+sp.join("; ")+".":"");S.syncRes=S.msg}
 }catch(e){S.err="Sync did not work: "+((e&&e.message)||e)}
 S.syncing=false;S.syncMsg="";render()}


/* ---- deliveries shown from the database ---- */
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+1)%7));return d.getTime()}   // last Saturday 00:00
function dlv(c){
 const w=weekDel(c),ps=w.ps.slice().sort((a,b)=>a.ts-b.ts);
 if(!ps.length)return `<div class="dlvrow"><div class="dlvh"><b>Delivery this week</b><span class="ctag t-no">Not yet</span></div></div>`;
 const head=w.state=="part"?`<span class="ctag t-part">${w.got} of ${w.need} boxes delivered</span>`:`<span class="ctag t-ok">${w.need>1?"All "+w.need+" boxes delivered":"Delivered"}</span>`;
 return `<div class="dlvrow ${w.state=="part"?"part":""}"><div class="dlvh"><b>Delivery this week${ps.length>1?" ("+ps.length+")":""}</b>${head}</div>`+ps.map(p=>{const has=p.links.length||(p.paths||[]).some(x=>x&&x!="-");
  return `<div class="dlv1">${letterChip(c,p)||'<span class="ctag t-ok">Delivered</span>'}<span class="dwho">${esc([p.drv,shortAt(p.at)].filter(Boolean).join(" · "))}</span>${has?`<button onclick="showPodO(${c.id},'${esc(p.oid)}')">View photo${p.links.length>1?"s ("+p.links.length+")":""}</button>`:'<span class="note">no photo yet</span>'}${/^https?:\/\//i.test(p.rec)?`<a href="${esc(p.rec)}" target="_blank" rel="noopener noreferrer">Receipt</a>`:""}</div>`}).join("")+`</div>`}
function podRec(c,w){const p=w._p||podFor(c,w.w);if(!p)return "";const r=p.rec;return (/^https?:\/\//i.test(r)?`<a href="${esc(r)}" onclick="return linkPop(this.href,'Receipt')">Receipt</a> `:"")+`<span class="note">${esc([p.drv,p.at||p.k].filter(Boolean).join(" · "))}</span>`}
function podPics(c,w){const p=w._p||podFor(c,w.w);if(!p)return "";return (p.links.length||(p.paths||[]).some(x=>x&&x!="-"))?`<button onclick="showPodO(${c.id},'${esc(p.oid)}')">View photo${p.links.length>1?"s ("+p.links.length+")":""}</button>`:'<span class="note">no photo yet</span>'}
function showPodO(id,oid){const c=cust.find(x=>x.id==id),p=(c.pods||[]).find(x=>x.oid==oid);if(p)showPodP(c,p)}

render();
boot();
