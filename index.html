.bh{display:flex;gap:12px;align-items:center;margin-bottom:10px}.lt{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background:color-mix(in srgb,var(--c) 20%,transparent);color:color-mix(in srgb,var(--c) 65%,var(--tx))}

.bxs.sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.bxs.sm .bx{padding:8px 10px}.bxs.sm .lt{width:32px;height:32px;font-size:14px;border-radius:9px}.bxs.sm .big{font-size:20px}.bxs.sm .bh{margin-bottom:6px;gap:8px}.bxs.sm .br{font-size:11px;margin-top:3px}.bxs.sm .br span{width:56px}
.mhero{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 12%,var(--card)),var(--card))}
.mst{display:flex;gap:10px}.mst div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 16px;text-align:center}.mst b{display:block;font-size:24px;line-height:1.1}.mst span{font-size:12px;color:var(--mut)}

.mt{display:inline-flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:14px;border:1px solid var(--ln);background:var(--card)}.mt:hover{border-color:var(--c)}
.mt.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}
.mk{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--tx))}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}.mit{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.mn{width:22px;height:22px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 70%,var(--tx))}
.wbars{display:flex;gap:10px;align-items:stretch;height:200px}.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer;min-width:0}.wb span{color:var(--mut)}
.wt{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}.wbar{width:100%;max-width:60px;background:var(--ac);border-radius:8px 8px 0 0}.wb:hover .wbar{opacity:.8}
.dgrid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}.dblk{flex:1 1 100%;min-width:0;position:relative}.dblk.half{flex:1 1 calc(50% - 6px)}.dblk>.card{margin:0}
.dtool{position:absolute;top:8px;right:10px;display:flex;gap:4px;align-items:center;z-index:2;opacity:.45;background:var(--card);border-radius:8px;padding:1px 3px}.dblk:hover .dtool{opacity:1}.dtool button{padding:0 6px;font-size:11px;line-height:20px;min-height:0}.dh{cursor:grab;font-size:18px;line-height:1;padding:0 4px;user-select:none}
@media(max-width:820px){.dblk.half{flex-basis:100%}}
.tw{position:relative;cursor:grab}.ttool{position:absolute;top:4px;right:4px;z-index:2;display:flex;gap:2px}.ttool button{padding:0 5px;font-size:11px;line-height:18px;min-height:0}
.nodrill tr.row,.nodrill .ctag,.nodrill .tag{pointer-events:none}
</style></head><body>
<header><span style="display:inline-flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="height:38px;width:auto"><b>Satmar Meats</b></span><nav id="nav"></nav><span id="who"></span></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const F={raw:"Raw",rawnb:"Raw - No Beef",meals:"Meals",supper:"Supper",shabbos:"Shabbos"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const refs=["UJO - 1001","CCS - 82 - 0119","LT00001","4821","Sample 718-555-0104","UJO - 1006","PT - 2207","LH - 3310","UJO - 1009","RY - 4402"];
const ags=["UJO","CCS","LT","UJO","UJO","UJO","PT","LH","UJO","RY"];
const foods=["meals","meals","raw","rawnb","supper","shabbos","meals","raw","meals","shabbos"];
const codes=[["E","B"],["E","A"],["A","M"],["A","Mc"],["E","A"],["A","3"],["H"],["B"],["E","A","B"],["A","3","3"]];
const areas=["Lee","Bedford","BP","Lee","Bedford","Lee","BP","Bedford","Lee","Middleton"];
let cust=refs.map((r,i)=>({id:i+1,name:"Sample Family "+"ABCDEFGHIJ"[i],ref:r,agency:ags[i],a:{st:(100+i*7)+" Test St",city:"Brooklyn",state:"NY",zip:"11211"},apt:"Apt "+(i+1),legal:(100+i*7)+" Test St, Apt "+(i+1)+", Brooklyn, NY, 11211",addr:(100+i*7)+" Test St, Apt "+(i+1)+", Brooklyn, NY, 11211",phone:"718-555-01"+(10+i),email:"",auth:new Date(2026,10,4+i*7),hh:(i%6)+1,food:foods[i],base:(foods[i]=="raw"||foods[i]=="rawnb")?"box":"meals",codes:codes[i],area:areas[i],lock:i%3==0?"1234":"",notes:"",delivered:i%3!=0,
 weeks:["10/26","10/19","10/12"].map((w,k)=>({w:w,on:!(k==2&&i%4==0),got:k==2&&i%4==0?"":F[foods[i]]+" "+codes[i].join(" "),pod:i%3!=0&&!(k==2&&i%4==0)}))}));
cust.forEach(c=>c.active=true);
(function(){
 const AG=["UJO","UJO","UJO","CCS","LT","PT","LH","RY"],FD=["meals","raw","raw","supper","shabbos","rawnb","meals"],AR2=["Lee","Bedford","BP","Lee","Bedford","Middleton","Monsey/Monroe"];
 const pad=(n,l)=>String(n).padStart(l,"0");
 for(let id=11;id<=4500;id++){
  const ag=AG[id%AG.length],food=FD[id%FD.length],active=id%2==0,hh=(id*7)%10+1;
  const base=(food=="raw"||food=="rawnb")&&id%4!=0?"box":"meals";
  const ref=ag=="CCS"?"CCS - 82 - "+pad(id,4):ag=="LT"?"LT"+pad(id,5):ag+" - "+id;
  const st=(100+id%900)+" Sample St",apt="Apt "+(1+id%20),addr=st+", "+apt+", Brooklyn, NY, 11211;".slice(0,0)+"";
  const full=[st,apt,"Brooklyn","NY","11211"].join(", ");
  cust.push({id:id,name:"Sample Family "+id,ref:ref,agency:ag,legal:full,addr:full,a:{st:st,city:"Brooklyn",state:"NY",zip:"11211"},apt:apt,phone:"718-555-"+pad(id%10000,4),email:"",
   auth:new Date(2026,10,4+(id*13)%400),hh:hh,food:food,base:base,codes:[],area:AR2[id%AR2.length],lock:"",notes:"",delivered:active&&id%3!=0,active:active,
   weeks:["10/26","10/19","10/12"].map((w,k)=>({w:w,on:k>0||active,got:(k>0||active)?"Sample":"",pod:(k>0||active)&&id%3!=0}))});
 }})();
const SET={1:["H","B","H","B"],2:["E C","A S","E C","3 B"],3:["E B","A M","E B","A 3"],4:["E A","A M","E A","A 3"],5:["E A","A D L","E A","A 3"],6:["E A B","D A L","E A B","A 3 3"]};for(let n=7;n<=10;n++)SET[n]=SET[6].slice();
function codesFor(food,hh,area){
 if(area=="Middleton")return "MN"+(hh>=3?"3+":Math.max(hh,1));
 const r=SET[Math.min(Math.max(hh,1),10)],i={meals:0,raw:1,rawnb:1,supper:2,shabbos:3}[food];let t=r[i];
 if(food=="rawnb")t=t.split(" ").map(x=>({S:"Sc",M:"Mc",L:"Lc"}[x]||x)).join(" ");return t}
function optList(base,agency){
 let o=base=="box"?[["raw","Box"],["rawnb","Box - No Beef"]]:[["meals","Meals"],["supper","Suppers"],["shabbos","Shabbos"]].concat(agency=="CCS"?[]:[["raw","Raw"],["rawnb","Raw - No Beef"]]);
 return o}
const fcls=c=>c.food=="meals"?"t-meals":c.food=="supper"?"t-sup":c.food=="shabbos"?"t-sab":c.food=="rawnb"?"t-nb":c.base=="box"?"t-box":"t-raw";
const optName=(base,food)=>(optList(base,"").find(x=>x[0]==food)||[0,F[food]])[1];
const tag=c=>(c.base=="box"?"Box":"Meals")+" "+codesFor(c.food,c.hh,c.area);
let S={user:null,view:"customers",sel:null,q:"",allowMid:false,real:false,mcpOK:false,loading:false,rerr:"",pg:0,dq:"",dpg:0,dflt:"all",msg:"",err:""},log=[],reqs=[];

const NAV={owner:[["dashboard","Dashboard"],["customers","Customers"],["changes","Changes"],["menu","Menu"],["billing","Billing"],["history","History"]],secretary:[["customers","Customers"],["changes","Changes"],["menu","Menu"]],billing:[["billing","Billing"]]};
const canEdit=()=>S.user&&S.user.role!=="billing";
const PAGES=[["dashboard","Dashboard"],["customers","Customers"],["changes","Changes"],["history","History"],["import","Import"],["settings","Settings"]];
const ROLE_PAGES={owner:PAGES.map(p=>p[0]),secretary:["customers","changes"],billing:[],demo:[]};
const ROLE_NAMES={owner:"Owner (admin)",secretary:"Office secretary",billing:"Billing",demo:"Demo only"};
function upages(u){if(!u)return [];if(u.role=="owner")return ROLE_PAGES.owner;return Array.isArray(u.pages)?u.pages.filter(p=>PAGES.some(q=>q[0]==p)&&p!="import"&&p!="settings"):[]}
function navFor(u){const a=upages(u);return PAGES.filter(p=>a.indexOf(p[0])>=0)}
let USERS=[];
function usave(){try{localStorage.setItem("sm_users",JSON.stringify(USERS))}catch(e){}}
const LG=(who,f,o,n)=>log.unshift({at:new Date().toLocaleString(),user:S.user.name,who:who,field:f,o:String(o),n:String(n)});
const DEMO=cust.slice();
function withDemo(fn){const keep=cust.splice(0,cust.length);DEMO.forEach(c=>cust.push(c));S.dmode=true;try{return fn()}finally{cust.length=0;keep.forEach(c=>cust.push(c));S.dmode=false}}
function vDemo(){
 const sub=S.dsub||"customers";
 return `<div class="card"><div class="bar"><b>Demo</b><span class="note">Made-up sample families only. Nothing here is real.</span><button class="${sub=="customers"?"on":""}" onclick="S.dsub='customers';render()">Customers</button><button class="${sub=="dashboard"?"on":""}" onclick="S.dsub='dashboard';render()">Dashboard</button></div></div><div class="nodrill">${withDemo(()=>sub=="dashboard"?vDash():vList(true))}</div>`}
function setOpt(k,v){const lab={allowMid:"Allow new Middleton requests",cut:"Cut-off has passed"}[k];LG("Setting",lab,S[k]?"on":"off",v?"on":"off");S[k]=!!v;S.msg=lab+": "+(v?"on":"off")+".";S.err="";render()}
function urole(i,v){const u=USERS[i],o=u.role;u.role=v;u.pages=ROLE_PAGES[v].slice();LG("Access · "+u.email,"Role",ROLE_NAMES[o],ROLE_NAMES[v]);usave();render()}
function upage(i,p,v){const u=USERS[i],has=u.pages.indexOf(p)>=0;if(v&&!has)u.pages.push(p);if(!v&&has)u.pages.splice(u.pages.indexOf(p),1);LG("Access · "+u.email,"Page "+p,has?"allowed":"not allowed",v?"allowed":"not allowed");usave();render()}
function uactive(i,v){const u=USERS[i];u.active=!!v;LG("Access · "+u.email,"Account",v?"off":"on",v?"on":"off");usave();render()}
function uadd(){const n=document.getElementById("nu_name").value.trim(),e=document.getElementById("nu_email").value.trim(),r=document.getElementById("nu_role").value;
 if(!e||e.indexOf("@")<1){S.err="Enter a valid email.";S.msg="";render();return}
 if(USERS.some(x=>x.email.toLowerCase()==e.toLowerCase())){S.err="This email is already in the list.";S.msg="";render();return}
 USERS.push({name:n||e.split("@")[0],email:e,role:r,pages:ROLE_PAGES[r].slice(),active:true});LG("Access · "+e,"Person added",""," "+ROLE_NAMES[r]);usave();S.msg=e+" added.";S.err="";render()}
function vSettings(){
 const pg=PAGES.filter(p=>p[0]!="settings");
 return `<div class="card"><h2>Changes for next week (${nwk()})</h2>
 <label><input type="checkbox" style="width:auto" ${S.allowMid?"checked":""} onchange="setOpt('allowMid',this.checked)"> Allow new Middleton requests</label>
 <label><input type="checkbox" style="width:auto" ${S.cut?"checked":""} onchange="setOpt('cut',this.checked)"> Cut-off has passed (only the admin can add changes)</label>
 <p class="note">Changes always start next week and never touch this week. When the cut-off has passed, only the admin can add or change a request. Every switch is saved in History.</p></div>
 <div class="card"><h2>People and access</h2>
 <p class="note">Choose which pages each person can open. A person is never deleted, only turned off, so the history stays. The Settings page is always yours. In this demo any password works; an email in this list gets exactly the pages ticked here, and a turned-off person cannot sign in. Real accounts and passwords come with the live system. This list is kept on this device until the database is connected.</p>
 <div class="wrap"><table><tr><th>Name</th><th>Email</th><th>Role</th>${pg.map(p=>`<th style="text-align:center;font-size:11px">${p[1]}</th>`).join("")}<th>Active</th></tr>
 ${USERS.map((u,i)=>`<tr style="${u.active?"":"opacity:.55"}"><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select onchange="urole(${i},this.value)">${Object.keys(ROLE_NAMES).map(r=>`<option value="${r}" ${u.role==r?"selected":""}>${ROLE_NAMES[r]}</option>`).join("")}</select></td>
 ${pg.map(p=>`<td style="text-align:center"><input type="checkbox" style="width:auto" ${upages(u).indexOf(p[0])>=0?"checked":""} ${u.role=="owner"?"disabled":""} onchange="upage(${i},'${p[0]}',this.checked)"></td>`).join("")}
 <td><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" ${u.active?"checked":""} onchange="uactive(${i},this.checked)"> ${u.active?"On":"Off"}</label></td></tr>`).join("")||`<tr><td colspan="${pg.length+4}" class="no">Nobody added yet. Add the first person below.</td></tr>`}</table></div>
 <h3 class="gh">Add a person</h3>
 <div class="bar"><input id="nu_name" placeholder="Name" style="max-width:180px"><input id="nu_email" type="email" placeholder="Email" style="max-width:240px"><select id="nu_role">${Object.keys(ROLE_NAMES).map(r=>`<option value="${r}">${ROLE_NAMES[r]}</option>`).join("")}</select><button class="pri" onclick="uadd()">Add person</button></div>
 <p class="note">The role fills in the usual pages (secretary: Customers, Changes, Menu; billing: Billing; demo: Demo). You can then tick or untick any page for that person.</p></div>
 <div class="card"><h2>Demo</h2><p class="note">The <b>Demo</b> page shows Customers and the Dashboard with made-up sample families only, never your real data. Give someone the "Demo only" role to show them the system without exposing any real family. A demo person cannot load or see real data.</p></div>`}
function go(v,id){S.view=v;S.sel=id||null;S.msg="";S.err="";render()}
function render(){
 const u=S.user,app=document.getElementById("app");
 document.getElementById("nav").innerHTML=u?navFor(u).map(n=>`<button class="${S.view==n[0]||(S.view=="card"&&n[0]=="customers")?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join(""):"";
 document.getElementById("who").innerHTML=u?`${esc(u.name)} (${esc(ROLE_NAMES[u.role]||u.role)}) <button onclick="openPw()">Password</button> <button onclick="out()">Sign out</button>`:"";
 if(!u){app.innerHTML=vLogin();return}
